            position: relative;
            display: inline-block;

        }

        .dropdown button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            font-size: 1.2em; /* Same font size as nav links */
        }

        .dropdown-content {
            display: none;
            position: absolute;
            top: 100%; /* Appear right below the button */
            left: 0;
            background-color: #f9f9f9;
            min-width: 160px;
            box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.2);
            z-index: 1;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        .dropdown-content a {
            color: black;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
        }

        .dropdown-content a:hover {

            text-align: center;
            padding: 20px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }

        .upgrade-form {

            padding: 30px;
            border-radius: 15px;

        .upgrade-form h2 {
